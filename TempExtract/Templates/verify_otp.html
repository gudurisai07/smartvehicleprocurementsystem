<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify OTP - Smart Vehicle Procurement</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    * { font-family: 'Inter', sans-serif; }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    body {
      background: linear-gradient(-45deg, #0f0c29, #302b63, #24243e, #0f0c29);
      background-size: 400% 400%;
      animation: gradientShift 15s ease infinite;
      min-height: 100vh;
      color: white;
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .glass-input {
      background: rgba(255, 255, 255, 0.07) !important;
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: white !important;
      letter-spacing: 0.5em;
      text-align: center;
      font-size: 1.5rem;
    }
    .glass-input:focus {
      background: rgba(255, 255, 255, 0.12) !important;
      border-color: rgba(99, 102, 241, 0.7) !important;
      outline: none;
    }

    .btn-primary {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      transition: all 0.3s ease;
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(99, 102, 241, 0.4);
    }
  </style>
</head>
<body class="flex items-center justify-center p-4">
  <div class="glass-card rounded-2xl p-10 w-full max-w-md animate-fadeSlideIn">
    <div class="text-center mb-8">
      <div class="w-16 h-16 mx-auto mb-4 rounded-full bg-indigo-600 bg-opacity-30 flex items-center justify-center border border-indigo-500 border-opacity-40">
        <span class="text-3xl">🛡️</span>
      </div>
      <h2 class="text-3xl font-bold">Verify OTP</h2>
      <p class="text-gray-400 mt-2 text-sm">A 6-digit code has been sent to your registered <b>mobile number</b> and <b>email address</b>.</p>
    </div>

    {% if messages %}
    <div class="mb-4">
      {% for message in messages %}
      <div class="p-3 rounded-lg {% if 'error' in message.tags %}bg-red-900 bg-opacity-50 text-red-200 border border-red-700{% else %}bg-green-900 bg-opacity-50 text-green-200 border border-green-700{% endif %} text-sm">
        {{ message }}
      </div>
      {% endfor %}
    </div>
    {% endif %}

    <form method="post" action="{% url 'verify_otp' %}">
      {% csrf_token %}
      <div class="mb-6">
        <input type="text" name="otp" maxlength="6" placeholder="000000"
          class="glass-input w-full px-4 py-4 rounded-xl text-white font-bold" required>
      </div>
      <button type="submit" class="btn-primary w-full py-3 text-white font-semibold rounded-xl text-base">
        Verify OTP →
      </button>
    </form>

    <p class="text-center text-gray-400 mt-6 text-sm">
      Didn't receive code?
      <a href="{% url 'forgot_password_request' %}" class="text-indigo-400 hover:text-indigo-300 font-medium">Resend</a>
    </p>

    <div class="text-center mt-4">
      <a href="{% url 'userLoginForm' %}" class="text-gray-500 hover:text-white text-xs">Back to Login</a>
    </div>
  </div>
</body>
</html>
