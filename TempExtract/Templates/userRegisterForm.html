<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Smart Vehicle Procurement System - User Registration</title>
 <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
 <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
 <style>
  @keyframes gradientShift { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
  .animate-gradient { background: linear-gradient(-45deg, #0f172a, #1e1b4b, #312e81, #1e293b); background-size: 400% 400%; animation: gradientShift 15s ease infinite; }
  .glass-effect { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
  .glass-input { background: rgba(0, 0, 0, 0.2); border: 1px solid rgba(255, 255, 255, 0.1); color: white; transition: all 0.3s ease; }
  .glass-input:focus { background: rgba(0, 0, 0, 0.4); border-color: #6366f1; outline: none; box-shadow: 0 0 15px rgba(99, 102, 241, 0.3); }
  .btn-primary { background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%); transition: all 0.3s ease; }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(79, 70, 229, 0.4); }
  #three-canvas { position: fixed; top: 0; left: 0; z-index: -1; width: 100%; height: 100vh; opacity: 0.6; }
 </style>
</head>
<body class="font-sans text-white min-height-screen overflow-x-hidden animate-gradient">
  <canvas id="three-canvas"></canvas>

  <div class="container mx-auto px-4 py-6 md:py-12 relative z-10">
    <div class="w-full max-w-4xl mx-auto glass-effect rounded-2xl md:rounded-3xl p-6 md:p-10 shadow-2xl mt-4 sm:mt-0">
      <div class="text-center mb-8 md:mb-10">
        <h1 class="text-4xl md:text-5xl font-extrabold mb-3 bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 via-purple-400 to-pink-400 drop-shadow-lg leading-tight tracking-tight"> userRegisterCheck <span class="inline-block text-3xl">🚀</span></h1>

      </div>

      {% if messages %}
      <div class="mb-6 space-y-2">
        {% for message in messages %}
        <div class="px-4 py-3 rounded-xl {% if message.tags == 'error' %}bg-red-900/50 text-red-200 border border-red-500/50{% else %}bg-green-900/50 text-green-200 border border-green-500/50{% endif %}">
          {{ message }}
        </div>
        {% endfor %}
      </div>
      {% endif %}

      <form method="post" action="userRegisterCheck">
        {% csrf_token %}
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
          <div>
            <label class="block text-indigo-400 text-lg font-medium mb-2">Full Name</label>
            <input type="text" name="name" maxlength="50" placeholder="Enter Full Name"
              class="glass-input w-full px-4 py-3 rounded-xl" required value="{{ form_data.name }}">
          </div>
          <div>
            <label class="block text-cyan-400 text-lg font-medium mb-2">Email</label>
            <input type="email" id="email" name="email" placeholder="Enter Email"
              class="glass-input w-full px-4 py-3 rounded-xl" required value="{{ form_data.email }}">
          </div>
          <div>
            <label class="block text-purple-400 text-lg font-medium mb-2">Login ID</label>
            <input type="text" name="loginid" maxlength="30" placeholder="Choose a Login ID"
              class="glass-input w-full px-4 py-3 rounded-xl" required value="{{ form_data.loginid }}">
          </div>
          <div class="md:col-span-1">
            <label class="block text-green-400 text-lg font-medium mb-2">Mobile Number</label>
            <input type="text" id="reg_mobile" name="mobile" maxlength="10" placeholder="10-digit Mobile Number"
              class="glass-input w-full px-4 py-3 rounded-xl" required value="{{ form_data.mobile }}">
          </div>
          <div class="md:col-span-2">
            <label class="block text-yellow-400 text-lg font-medium mb-2">Password</label>
            <input type="password" name="password" maxlength="128" placeholder="Create Password"
              class="glass-input w-full px-4 py-3 rounded-xl" required>
          </div>
        </div>
        <!-- Location with Live GPS -->
        <div class="mb-8">
          <label class="block text-pink-400 text-lg font-medium mb-2">📍 Location</label>
          <div class="flex items-center space-x-2">
            <input type="text" id="location" name="location" placeholder="Enter city or fetch live location"
              class="glass-input w-full px-4 py-3 rounded-xl" required value="{{ form_data.location }}">
            <button type="button" onclick="getLiveLocation()"
              class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-4 rounded-xl flex-shrink-0 transition">
              📍 Live
            </button>
          </div>
          <p id="location-status" class="text-xs text-yellow-400 mt-1 hidden"></p>
        </div>
        <button type="submit" id="submitBtn" class="btn-primary w-full py-4 text-white font-bold rounded-xl text-lg hover:shadow-lg transition-transform">
          Create Account →
        </button>
      </form>

      <p class="text-center text-gray-400 mt-6 text-sm">
        Already have an account?
        <a href="userLoginForm" class="text-green-400 hover:text-green-300 font-medium">Login here</a>
      </p>
    </div>
  </div>

  <script>
    // Real-time OTP Verification - Removed
    
    async function getLiveLocation() {
      const locStatus = document.getElementById('location-status');
      const locInput = document.getElementById('location');
      if (navigator.geolocation) {
        locStatus.textContent = "📡 Fetching location...";
        locStatus.classList.remove('hidden');
        navigator.geolocation.getCurrentPosition(async (position) => {
          const lat = position.coords.latitude;
          const lon = position.coords.longitude;
          try {
            const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`);
            const data = await res.json();
            if (data && data.display_name) {
              locInput.value = data.display_name;
              locStatus.textContent = "✅ Location fetched!";
              locStatus.className = "text-xs mt-1 text-green-400";
            } else {
              locInput.value = `${lat}, ${lon}`;
            }
          } catch {
            locInput.value = `${lat}, ${lon}`;
          }
        }, () => {
          locStatus.textContent = "❌ Access denied. Type manually.";
          locStatus.className = "text-xs mt-1 text-red-400";
        });
      }
    }
  </script>
  <script>
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('three-canvas'), alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);

    const particles = new THREE.BufferGeometry();
    const particleCount = 1500;
    const posArray = new Float32Array(particleCount * 3);
    for (let i = 0; i < particleCount * 3; i++) {
      posArray[i] = (Math.random() - 0.5) * 10;
    }
    particles.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
    const material = new THREE.PointsMaterial({ size: 0.005, color: '#6366f1' });
    const particlesMesh = new THREE.Points(particles, material);
    scene.add(particlesMesh);
    camera.position.z = 2;

    function animate() {
      requestAnimationFrame(animate);
      particlesMesh.rotation.y += 0.001;
      particlesMesh.rotation.x += 0.0005;
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
